name: Deploy to Google Apps Script

# Uploads Code.gs + appsscript.json to the Apps Script project in
# .clasp.json. If the repository secret SHOPIFY_CLIENT_SECRET is set,
# it is delivered to the script too (as a generated Secrets.gs that is
# never committed to GitHub).
on:
  push:
    branches: [main, claude/funny-goldberg-ee63i0]
    paths:
      - 'Code.gs'
      - 'appsscript.json'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON is not set. See README.md."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Generate Secrets.gs
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          node -e '
            const v = (process.env.SHOPIFY_CLIENT_SECRET || "").trim();
            const body = v
              ? "// Generated by GitHub Actions. Do not edit; update the GitHub secret instead.\nvar DEPLOY_SHOPIFY_CLIENT_SECRET = " + JSON.stringify(v) + ";\n"
              : "// Generated by GitHub Actions. No SHOPIFY_CLIENT_SECRET secret set.\nvar DEPLOY_SHOPIFY_CLIENT_SECRET = \"\";\n";
            require("fs").writeFileSync("Secrets.gs", body);
            console.log(v ? "Shopify client secret will be deployed." : "No Shopify secret set; Script Property will be used.");
          '

      - name: Check syntax
        run: cat Secrets.gs Code.gs > /tmp/Code.js && node --check /tmp/Code.js

      - name: Push to Apps Script
        run: clasp push --force
