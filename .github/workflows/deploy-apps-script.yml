name: Deploy to Google Apps Script

# Uploads Code.gs + appsscript.json to the Apps Script project in
# .clasp.json. If the repository secret SHOPIFY_CLIENT_SECRET is set,
# it is delivered to the script too (as a generated Secrets.gs that is
# never committed to GitHub).
on:
  push:
    branches: [main, claude/funny-goldberg-ee63i0]
    paths:
      - 'Code.gs'
      - 'appsscript.json'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON is not set. See README.md."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      # clasp push replaces every file in the Apps Script project, so first
      # fetch the Secrets.gs that is there now and push it back unchanged.
      # Only if the GitHub secret SHOPIFY_CLIENT_SECRET is set is it replaced.
      - name: Keep or update Secrets.gs
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          mkdir -p /tmp/live && cp .clasp.json /tmp/live/ && (cd /tmp/live && clasp pull >/dev/null)
          node -e '
            const fs = require("fs");
            const v = (process.env.SHOPIFY_CLIENT_SECRET || "").trim();
            let body;
            if (v) {
              body = "// Generated by GitHub Actions from the SHOPIFY_CLIENT_SECRET secret.\nvar DEPLOY_SHOPIFY_CLIENT_SECRET = " + JSON.stringify(v) + ";\n";
              console.log("Secrets.gs: updated from GitHub secret.");
            } else if (fs.existsSync("/tmp/live/Secrets.gs")) {
              body = fs.readFileSync("/tmp/live/Secrets.gs", "utf8");
              console.log("Secrets.gs: kept the version already in Apps Script.");
            } else {
              body = "// No secret here: the SHOPIFY_CLIENT_SECRET Script Property is used.\nvar DEPLOY_SHOPIFY_CLIENT_SECRET = \"\";\n";
              console.log("Secrets.gs: none found; created an empty one.");
            }
            fs.writeFileSync("Secrets.gs", body);
          '
          rm -rf /tmp/live

      - name: Check syntax
        run: cat Secrets.gs Code.gs > /tmp/Code.js && node --check /tmp/Code.js

      - name: Push to Apps Script
        run: clasp push --force
