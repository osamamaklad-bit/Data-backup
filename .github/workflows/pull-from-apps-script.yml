name: Sync back from Google Apps Script

# Copies edits made in the Apps Script editor back into this repo.
# Runs once a day (03:23 Cairo time) and can be started by hand from
# the Actions tab whenever you need it sooner.
# Each run is ~30 seconds and only 2 Google API calls (token refresh +
# download). Commits made here use GITHUB_TOKEN, so they do NOT trigger
# the deploy workflow again (no loop).
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-script-sync
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON is not set. See README.md."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Pull from Apps Script
        run: |
          clasp pull
          # Never commit a secrets file if one is ever added in the editor
          rm -f Secrets.gs Secrets.js

      - name: Check syntax
        run: |
          for f in *.gs; do
            cp "$f" /tmp/check.js && node --check /tmp/check.js
          done

      - name: Commit changes, if any
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Apps Script and GitHub are already in sync."
            exit 0
          fi
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync edits from Apps Script editor"
          git push
